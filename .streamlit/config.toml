# Base theme for the dashboard. The finer styling lives in
# src/dashboard/components/theme.py; this sets what Streamlit needs before
# any custom CSS is applied, so the first paint is not a white flash.

[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131C2E"
textColor = "#E8EEF7"
font = "sans serif"

[server]
headless = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false
